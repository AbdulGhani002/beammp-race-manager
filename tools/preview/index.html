<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Race Manager preview</title>
<!-- Run tools/preview/serve.sh, do not open this file directly. -->
<style>
  /* no scrollbars, like the game: a bar hung off the edge gave the page one
     and the app's box lost fifteen pixels to it */
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2a2f36; font-family: sans-serif; }
  /* stands in for the game behind the overlay */
  /* stands in for sky and dirt behind the overlay, so contrast is judged
     against something like the map rather than against black */
  #stage { position: absolute; inset: 0;
    background: linear-gradient(#6b7f96 0%, #97a4ae 40%, #bda887 40%, #8e7a5c 100%); }
  #picker { position: fixed; bottom: 6px; left: 6px; z-index: 9999; }
  #picker button { font: 12px sans-serif; margin-right: 4px; padding: 4px 8px; }
</style>
<script src="angular.min.js"></script>
</head>
<body>
<div id="stage"></div>

<div id="picker">
  <button onclick="show('idle')">idle</button>
  <button onclick="show('picking')">picking</button>
  <button onclick="show('armed')">armed</button>
  <button onclick="show('running')">running</button>
  <button onclick="show('lights')">lights</button>
  <button onclick="show('wrap')">wrap</button>
  <button onclick="show('waiting')">waiting</button>
  <button onclick="show('results')">results</button>
</div>

<div ng-app="preview" style="position:absolute; inset:0;">
  <race-manager></race-manager>
</div>

<script>
// ?box=0.82x0.59 puts the app in a box that size in the middle of the
// screen, the way an edited layout did in the game, so what the bars do in
// a box that is not the screen can be seen here. Set before angular runs,
// because a saved spot is put back when the app is built.
(function () {
  var m = /[?&]box=([\d.]+)x([\d.]+)/.exec(location.search);
  if (!m) return;
  var el = document.querySelector("[ng-app]");
  var w = parseFloat(m[1]) * 100, h = parseFloat(m[2]) * 100;
  el.style.inset = "auto";
  el.style.left = ((100 - w) / 2) + "%";
  el.style.top = ((100 - h) / 2) + "%";
  el.style.width = w + "%";
  el.style.height = h + "%";
  el.style.outline = "2px dashed rgba(255,255,255,0.6)";
})();
</script>

<script>
// the two globals the app talks to in the game
window.bngApi = {
  engineLua: function (e) { console.log("engineLua:", e); },
  // his tachometer and Stella talk to the car through this one too
  activeObjectLua: function (e) { console.log("activeObjectLua:", String(e).slice(0, 60)); }
};
window.StreamsManager = { add: function () {}, remove: function () {} };
// unit helpers the tachometer reads. the game has the real ones.
window.UiUnits = {
  speed: function (ms) { return { val: (ms || 0) * 2.23694, unit: "mph" }; },
  temperature: function (c) { return { val: c * 9 / 5 + 32, unit: "F" }; },
  pressure: function (bar) { return { val: bar * 14.5, unit: "psi" }; }
};
window.guihooks = { trigger: function (n, d) { console.log("guihooks:", n); } };

// The game's app loader. Race Manager mounts the other two apps through it,
// so the preview needs one that does the same thing: fetch the script, run
// it, and let the directive it registers be found afterwards.
angular.module("oc.lazyLoad", []).provider("$ocLazyLoad", function () {
  var $compileProvider = null;
  this.$get = ["$q", function ($q) {
    return {
      load: function (src) {
        return $q(function (resolve, reject) {
          if (document.querySelector('script[src="' + src + '"]')) { resolve(); return; }
          var tag = document.createElement("script");
          tag.src = src;
          tag.async = false;
          tag.onload = function () { resolve(); };
          tag.onerror = function () { reject("failed to load " + src); };
          document.head.appendChild(tag);
        });
      }
    };
  }];
});

angular.module("beamng.apps", ["oc.lazyLoad"])
  .config(["$compileProvider", "$provide", function ($compileProvider, $provide) {
    // a script loaded after bootstrap calls .directive() on the module, which
    // does nothing on its own once the injector exists. this is what ocLazyLoad
    // does in the game: route late registrations to the live providers.
    var mod = angular.module("beamng.apps");
    var realDirective = mod.directive;
    mod.directive = function (name, factory) {
      $compileProvider.directive(name, factory);
      return mod;
    };
  }]);
</script>

<script src="ui/modules/apps/RaceManager/app.js"></script>

<script>
var NOW = Math.floor(Date.now() / 1000);

// his classes, the same list the server sends, so the picker here is the
// picker in the game
var CLASSES = [
  { division: "Limited",   name: "Class 10" },
  { division: "Limited",   name: "Class 12" },
  { division: "Limited",   name: "Class 5" },
  { division: "Limited",   name: "Class 7 Stock" },
  { division: "Limited",   name: "UTV Pro Turbo" },
  { division: "Limited",   name: "UTV Pro NA" },
  { division: "Limited",   name: "UTV Pro Open" },
  { division: "Limited",   name: "Class 5/1600, 1600 & Class 9" },
  { division: "Limited",   name: "Class 11" },
  { division: "Limited",   name: "Trophy Truck Spec" },
  { division: "Limited",   name: "1450" },
  { division: "Limited",   name: "Class 2000" },
  { division: "Unlimited", name: "Class 1" },
  { division: "Unlimited", name: "Class 6200" },
  { division: "Unlimited", name: "Class 7 Unlimited" },
  { division: "Unlimited", name: "Class 8" },
  { division: "Unlimited", name: "Trophy Truck" }
];

var TRACKS = [
  { id: "baja-1000", name: "Baja 1000", kind: "race", level: "utah_sc", circuit: true, count: 30 },
  { id: "sprint", name: "Airfield sprint", kind: "timeattack", level: "utah_sc", circuit: false, count: 12 }
];

function base() {
  return {
    ready: true, needsName: false, connected: true, isAdmin: true,
    level: "utah_sc",
    me: { id: 1, name: "abd", role: "owner", level: 7, guest: false },
    roster: [
      { id: 1, name: "abd", level: 7, speed: 62, ping: 38 },
      { id: 2, name: "Dard", level: 12, speed: 0, ping: 74 },
      { id: 3, name: "Marx", level: 3, speed: 91, ping: 210, guest: true }
    ],
    rosterOpen: true,
    tracks: TRACKS,
    capture: { active: false, gate: { w: 20, h: 8, d: 3 } },
    perf: {},
    config: { discordUrl: "https://discord.gg/7JHKJbHNt", nameMinLen: 3, nameMaxLen: 20,
              classes: CLASSES,
              penalties: { recovery: 60, flatTire: 30, repair: 30, missedGate: 30 } },
    records: {
      id: "baja-1000",
      classes: ["UTV Pro NA", "Class 11", "Trophy Truck"],
      modes: {
        controller: {
          total: 4,
          lap: { time: 402.118, name: "Dard", at: NOW - 86400 * 2 },
          top: [
            { pos: 1, name: "Dard",  corrected: 402.118, laps: 1,
              class: "Trophy Truck", at: NOW - 86400 * 2 },
            { pos: 2, name: "abd",   corrected: 441.902, laps: 1,
              class: "Class 11", at: NOW - 86400, me: true },
            { pos: 3, name: "Rico",  corrected: 468.5,   laps: 1,
              class: "UTV Pro NA", at: NOW - 86400 * 9 },
            { pos: 4, name: "Colt",  corrected: 512.04,  laps: 1, at: NOW }
          ]
        },
        wheel: {
          total: 1,
          top: [ { pos: 1, name: "Dard", corrected: 399.004, laps: 1,
                   class: "Trophy Truck", at: NOW - 86400 * 30 } ]
        }
      }
    },
    race: { state: "idle" }
  };
}

function splitsFor(n, step, holes) {
  var out = [], t = 0;
  for (var i = 1; i <= n; i++) {
    if (holes && holes.indexOf(i) >= 0) { out.push(false); t += step; continue; }
    out.push(Math.round(t * 1000) / 1000);
    t += step;
  }
  return out;
}

function sectorsFor(splits, n, lapTime) {
  var out = [false];
  for (var g = 2; g <= n; g++) {
    var a = splits[g - 2], b = splits[g - 1];
    out.push((typeof a === "number" && typeof b === "number")
      ? Math.round((b - a) * 1000) / 1000 : false);
  }
  var last = splits[n - 1];
  out.push(typeof last === "number" ? Math.round((lapTime - last) * 1000) / 1000 : false);
  return out;
}

function entry(name, pos, corrected, clean, penalties, holes) {
  var GATES = 30, lapTime = clean;
  var sp = splitsFor(GATES, clean / GATES, holes);
  var se = sectorsFor(sp, GATES, lapTime);
  var cut = (holes || []).length > 0;
  return {
    name: name, pos: pos, corrected: corrected, clean: clean,
    penalties: penalties, suspect: name === "Marx",
    // the server refuses a cut lap the record, so the fixture has to as well
    // or the preview shows a screen the game will never produce
    bestLap: cut ? null : { time: lapTime, lap: 1 },
    bestSector: { time: 21.418, gate: 14, lap: 1 },
    laps: [{ lap: 1, time: lapTime, splits: sp, sectors: se, missed: holes || [] }]
  };
}

var SCENES = {
  idle: function () { var s = base(); return s; },

  picking: function () {
    var s = base();
    s.race = { state: "idle" };
    return s;
  },

  // nothing is drawn over the road before the clock exists. the message is
  // what the client pushes on arming, so the scene carries it.
  armed: function () {
    var s = base();
    s.race = { state: "armed", track: "baja-1000", trackName: "Baja 1000",
               mode: "wheel", laps: 2, lap: 0, gates: 30, next: 1, circuit: true,
               penalties: 0, elapsed: 0 };
    s.toast = { text: "Baja 1000 is on. Your clock starts when you cross the start line.",
                secs: 10, seq: Date.now() };
    return s;
  },

  running: function () {
    var s = base();
    s.race = { state: "running", track: "baja-1000", trackName: "Baja 1000",
               mode: "wheel", laps: 2, lap: 1, gates: 30, next: 14, done: 13, circuit: true,
               penalties: 1, penaltyTime: 30,
               penaltyBy: { missed_gate: 1 }, elapsed: 477.3,
               lastSplit: { gate: 13, lap: 1, split: 421.882 } };
    return s;
  },

  // the light menu open and a message counting itself down, which is where
  // the annoying half of the interface lives
  lights: function () {
    var s = base();
    s.race = { state: "running", track: "baja-1000", trackName: "Baja 1000",
               mode: "wheel", laps: 2, lap: 2, gates: 30, next: 23, done: 22, circuit: true,
               penalties: 3, penaltyTime: 120,
               penaltyBy: { missed_gate: 1, recovery: 1, repair: 1 },
               elapsed: 619.2 };
    s.lights = true;
    s.toast = { text: "Repair holds the car 60s and puts 30s on this run",
                secs: 10, seq: Date.now() };
    return s;
  },

  // every gate done, driving back to the line. the bar used to empty here.
  wrap: function () {
    var s = base();
    s.race = { state: "running", track: "baja-1000", trackName: "Baja 1000",
               mode: "wheel", laps: 2, lap: 1, gates: 30, next: 1, done: 30,
               circuit: true, penalties: 5, penaltyTime: 150, elapsed: 303.5 };
    return s;
  },

  // in, and somebody is still out there. it used to be a box pinned in the
  // corner that never left on its own.
  waiting: function () {
    var s = base();
    s.race = { state: "finished", track: "baja-1000", trackName: "Baja 1000",
               mode: "wheel", laps: 1, lap: 1, gates: 30, next: 0, circuit: true,
               penalties: 0, waiting: 2 };
    s.toast = { text: "You are in. Waiting on 2 drivers still on track.",
                secs: 10, seq: Date.now() };
    return s;
  },

  results: function () {
    var s = base();
    s.race = {
      state: "finished", track: "baja-1000", trackName: "Baja 1000",
      results: {
        track: "baja-1000", trackName: "Baja 1000", circuit: true, gates: 30,
        bestLap: { time: 642.118, lap: 1, name: "Dard" },
        finished: [
          entry("Dard", 1, 642.118, 642.118, [], []),
          entry("abd", 2, 659.004, 659.004, [], []),
          entry("Marx", 3, 678.441, 618.441, [
            { seconds: 30, reason: "missed_gate", gate: 11, lap: 1 },
            { seconds: 30, reason: "missed_gate", gate: 12, lap: 1 }
          ], [11, 12])
        ],
        dnf: [{ name: "Vince", why: "ended by the driver", lap: 1, dnf: true }]
      }
    };
    s.race.results.finished[1].toLeader = 16.886;
    s.race.results.finished[1].toAhead = 16.886;
    s.race.results.finished[2].toLeader = 36.323;
    s.race.results.finished[2].toAhead = 19.437;
    s.race.results.finished[0].toLeader = 0;
    s.race.results.finished[0].toAhead = 0;
    return s;
  }
};

angular.module("preview", ["beamng.apps"])
  .run(["$templateCache", "$http", "$rootScope",
    function ($templateCache, $http, $rootScope) {
      $http.get("ui/modules/apps/RaceManager/app.html").then(function (r) {
        $templateCache.put("/ui/modules/apps/RaceManager/app.html", r.data);
        window.__root = $rootScope;
        setTimeout(function () { show(location.hash.slice(1) || "results"); }, 60);
      });
    }]);

function show(which) {
  if (!window.__root) return;
  location.hash = which;
  var scene = (SCENES[which] || SCENES.idle)();
  window.__root.$broadcast("rmState", scene);
  window.__root.$applyAsync();
  if (which === "picking") {
    setTimeout(function () {
      var sel = document.querySelector(".rm-race select");
      if (sel) { sel.selectedIndex = 0; sel.dispatchEvent(new Event("change")); }
    }, 80);
  }
}
</script>
</body>
</html>
